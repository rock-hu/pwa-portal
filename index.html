<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />

    <base href="/" />

    <!-- This meta viewport ensures the webpage's dimensions change according to the device it's on. This is called Responsive Web Design.-->
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <meta name="description" content="This is a pwa-portal app" />

    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#181818"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f3f3f3"
    />

    <!-- These meta tags are Apple-specific, and set the web application to run in full-screen mode with a black status bar. Learn more at https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="pwa-portal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <meta
      data-rh="true"
      property="og:image"
      content="https://refine.dev/img/refine_social.png"
    />
    <meta
      data-rh="true"
      name="twitter:image"
      content="https://refine.dev/img/refine_social.png"
    />

    <!-- This tag is used by the pwa-portal CLI to identify template projects. Don't remove if you are using the CLI. -->
    <meta name="pwa-starter-template-identity" content="pwa-starter" />

    <!-- Imports an icon to represent the document. -->
    <link rel="icon" href="/assets/icons/icon_24.png" type="image/png" />

    <title>
      Refine - Build your React-based applications, without constraints.
    </title>

  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
